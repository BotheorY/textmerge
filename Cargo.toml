[package]
name = "textmerge"
version = "1.0.1"
edition = "2024"
license = "MIT"
description = "Portable, bounded-memory text file merging for Windows"
build = "build.rs"

[dependencies]
anyhow = "1"
blake3 = { version = "1", features = ["pure"] }
encoding_rs = "0.8"
rusqlite = { version = "0.37", features = ["bundled"] }
tempfile = "3"
winreg = "0.55"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Storage_FileSystem", "Win32_System_Com", "Win32_System_LibraryLoader", "Win32_System_SystemInformation", "Win32_System_SystemServices", "Win32_System_Threading", "Win32_UI_Controls", "Win32_UI_Controls_Dialogs", "Win32_UI_HiDpi", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_UI_WindowsAndMessaging"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

